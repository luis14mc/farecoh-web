[build]
builder = "NIXPACKS"
buildCommand = "pnpm install --frozen-lockfile && pnpm run build"

[deploy]
startCommand = "pnpm run db:migrate && node ./server.mjs"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[[deploy.env]]
name = "NODE_ENV"
value = "production"

[[deploy.env]]
name = "HOST"
value = "0.0.0.0"

[[deploy.env]]
name = "PORT"
value = "8080"
